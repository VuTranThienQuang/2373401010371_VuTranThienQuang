name: API Monitoring (Shift-Right Testing)

on:
  schedule:
    # Chạy định kỳ mỗi giờ (vào phút thứ 0)
    - cron: '0 * * * *'
  # Cho phép kích hoạt chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Monitoring Test (Response time < 800ms)
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run "postman/2373401010371_VuTranThienQuang_GoRest.postman_collection.json" \
            --environment "postman/2373401010371_VuTranThienQuang_GoRest_Env.postman_environment.json" \
            --env-var "token=$GOREST_TOKEN" \
            --folder "Positive_Cases" \
            --delay-request 100
