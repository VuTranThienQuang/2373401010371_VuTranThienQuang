name: API Monitoring (Shift-Right)

# Sự kiện kích hoạt workflow
on:
  # Chạy định kỳ vào mỗi giờ (0 phút mỗi giờ)
  schedule:
    - cron: '0 * * * *'
  # Cho phép kích hoạt thủ công từ giao diện GitHub
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Monitoring Test
        # Giả sử file collection dành cho giám sát là 'Monitoring_Collection.postman_collection.json'
        # Và bạn có một file môi trường 'Production.postman_environment.json' chứa URL của production
        run: |
          newman run 2373401010371_VuTranThienQuang_GoRest_Env.postman_collection.json \
            -e 2373401010371_VuTranThienQuang_GoRest_Env.postman_environment.json \
            --env-var "token=${{ secrets.API_TOKEN }}" \
            --reporters cli,junit \
            --reporter-junit-export monitor_results.xml

      - name: Publish Monitoring Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: monitor_results.xml
